<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PickleTown Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9f4;
      color: #222;
    }
    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }
    .hero {
      background: linear-gradient(135deg, #7ac143, #ddeb3b);
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    h1, h2, p {
      margin-top: 0;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dfcd;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #7ac143;
      color: white;
    }
    button:hover {
      opacity: 0.95;
    }
    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
    }
    .ok {
      background: #eef7e7;
      color: #29561e;
    }
    .error {
      background: #fdeaea;
      color: #8b1f1a;
    }
    .small {
      color: #5f6757;
      font-size: 14px;
      margin-top: 8px;
    }
    .links {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      background: #eef4e5;
      color: #222;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>PickleTown @Betshalom PickleBall League</h1>
      <p>Team Registration</p>
      <p class="small">
        Register your team for the current season. Teams entering after the active season lock date
        will automatically be queued for the next season.
      </p>
    </section>

    <section class="card">
      <h2>Register Your Team</h2>

      <label for="teamName">Team Name *</label>
      <input id="teamName" type="text" placeholder="Enter team name" />

      <label for="player1">Player 1 Name *</label>
      <input id="player1" type="text" placeholder="Enter Player 1 name" />

      <label for="player2">Player 2 Name *</label>
      <input id="player2" type="text" placeholder="Enter Player 2 name" />

      <label for="reservePlayer">Reserve Player Name</label>
      <input id="reservePlayer" type="text" placeholder="Optional reserve player" />

      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="Enter email address" />

      <label for="phone">Phone Number</label>
      <input id="phone" type="text" placeholder="Enter phone number" />

      <button onclick="registerTeam()">Submit Registration</button>

      <div id="message" style="display:none;"></div>

      <div class="links">
        <a href="/">View Live Leaderboard</a>
        <a href="/umpire">Umpire Scoring</a>
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxEBZgTg-SHJuNJojv-wrMOT1WgisOY88zDKyXp-n155FTixR5OBeMGAnhUDlBGT8aJ/exec";

    function showMessage(text, type) {
      const box = document.getElementById("message");
      box.style.display = "block";
      box.className = "message " + type;
      box.textContent = text;
    }

    async function getJson(params) {
      const url = API_URL + "?" + new URLSearchParams(params).toString();
      const res = await fetch(url);
      return await res.json();
    }

    async function registerTeam() {
      const teamName = document.getElementById("teamName").value.trim();
      const player1 = document.getElementById("player1").value.trim();
      const player2 = document.getElementById("player2").value.trim();
      const reservePlayer = document.getElementById("reservePlayer").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!teamName || !player1 || !player2) {
        showMessage("Team Name, Player 1 and Player 2 are required.", "error");
        return;
      }

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "registerTeam",
            payload: {
              teamName,
              player1,
              player2,
              reservePlayer,
              email,
              phone
            }
          })
        });

        const data = await res.json();

        if (!data.success) {
          showMessage(data.message || "Registration failed.", "error");
          return;
        }

        showMessage(data.message || "Registration saved successfully.", "ok");

        document.getElementById("teamName").value = "";
        document.getElementById("player1").value = "";
        document.getElementById("player2").value = "";
        document.getElementById("reservePlayer").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
      } catch (error) {
        showMessage("Could not submit registration. We will switch this page to the browser-friendly API version next if needed.", "error");
      }
    }
  </script>
</body>
</html>
